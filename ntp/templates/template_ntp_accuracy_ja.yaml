            value: '1'
          - type: INTEGER
            name: show.1
            value: '2'
        - type: svggraph
          name: NTPオフセット & ジッター推移
          y: '3'
          width: '36'
          height: '6'
          fields:
          - type: INTEGER
            name: ds.0.color_palette
            value: '0'
          - type: STRING
            name: ds.0.items.0
            value: ntp.offset.remote
          - type: STRING
            name: ds.0.items.1
            value: ntp.jitter.remote
          - type: INTEGER
            name: righty
            value: '0'
        - type: svggraph
          name: NTP推定遅延 (Delay)
          y: '9'
          width: '36'
          height: '5'
          fields:
          - type: INTEGER
            name: ds.0.color_palette
            value: '1'
          - type: STRING
            name: ds.0.items.0
            value: ntp.delay.remote
          - type: INTEGER
            name: righty
            value: '0'
