zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
    name: Templates/Applications
  templates:
  - uuid: 024ab0f7fd4240ada2de6a143173c6a3
    template: template_ntp_remote_accuracy
    name: NTPテンプレート（リモート）
    description: "## Overview\n\nNTP accuracy Template の日本語版です  \n英語版は[こちら](cat-app/ntp-accuracy-template)English version of the template is in the [link](cat-app/ntp-accuracy-template) .\n\n\n \n\n\nテンプレートを利用する場合zabbix\\_agentd.confでリモートコマンドを有効にしてください。\n\n\nEnableRemoteCommands=1  \nAllowKey=system.run[*]  # For Zabbix Agent 5.0+\nUnsafeUserParameters=1\n\n\nZabbixAgentがインストールされた環境に対しては  \nNTPテンプレートが使用できます。\n\n\nNTPアプライアンスなどZabbixAgentが使用できない環境のNTPサーバに対しては  \nNTPテンプレート（リモート）が使用できます。\n\n\nNTPテンプレート（リモート）を利用する場合はホストマクロにおいて  \n{$NTP\\_IP}に監視対象のIPアドレスを指定してください。\n\n\nntpqによって表示されるすべての項目が監視できます。\n\n\nNTP精度情報をグラフ化することが可能です。\n\n\n \n"
    items:
    - uuid: fecfe76f83874f26ba0633c24b4cbcfb
      name: ntpq({$NTP_IP})
      type: ZABBIX_ACTIVE
      key: system.run[ntpq -p {$NTP_IP}]
      delay: '3600'
      trends: '0'
      value_type: TEXT
      description: "\"*\"\t参照同期中のサーバーを表している\n\"+\"\tクロック誤り検査に合格したサーバー\n\"#\"\t参照同期中ではあるが、距離が遠いサーバー\n\" \"\t左に何も表示されない場合（空欄）、サーバーを参照していない\n\"x\"\tクロック誤り検査に不合格となったサーバー\n\". \"\t参照リストから除外されたサーバー\nrefid\tNTPサーバーが参照している上位ホスト名 or IPアドレス\nst\tNTPサーバーの階層\nt\t階層のタイプ　l:local、u:unicast、m:multicast、b:broadcast\nwhen\t最後のパケットを受け取ってからの時間（秒）\npoll\t問い合わせを行う間隔（秒）\nreach\t到達可能性に関するレジスタ・データ（8進数）\ndelay\t推定遅延（ミリ秒）\noffset\t偏差補償（ミリ秒）\njitter\tRMS Jitterの平均値（ミリ秒）\n"
      tags:
      - tag: Application
        value: NTP(リモート)
    - uuid: eb50dd404259418d9daf0c25a5f1c1b0
      name: NTP同期サーバ({$NTP_IP})
      type: DEPENDENT
      key: ntp.peer.remote
      delay: '0'
      history: 60d
      trends: '0'
      value_type: TEXT
      description: 同期しているNTPサーバー名
      tags:
      - tag: Application
        value: NTP(リモート)
      triggers:
      - uuid: c87d163a486748bbbb41141652e002f0
        expression: (last(/template_ntp_remote_accuracy/ntp.peer.remote,#1)<>last(/template_ntp_remote_accuracy/ntp.peer.remote,#2))=1
        name: 同期しているNTPサーバが変更されました。({$NTP_IP})
        status: DISABLED
        priority: INFO
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: REGEX
        parameters:
        - (?m)^[*o]\s*(\S+)
        - \1
    - uuid: 6e7a81899d1b40249a4641098c92d438
      name: NTP上位サーバ({$NTP_IP})
      type: DEPENDENT
      key: ntp.refid.remote
      delay: '0'
      history: 60d
      trends: '0'
      value_type: TEXT
      description: 同期しているNTPサーバーの上位NTPサーバ
      tags:
      - tag: Application
        value: NTP(リモート)
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: REGEX
        parameters:
        - (?m)^[*o]\s*\S+\s+(\S+)
        - \1
    - uuid: ed928784f44643d89b2a4f0e7f334546
      name: NTP階層({$NTP_IP})
      type: DEPENDENT
      key: ntp.stratum.remote
      delay: '0'
      history: 60d
      description: 同期しているNTPサーバーのstratum
      tags:
      - tag: Application
        value: NTP(リモート)
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: REGEX
        parameters:
        - (?m)^[*o]\s*\S+\s+\S+\s+(\d+)
        - \1
    - uuid: 8502c95081e74881a968675eec5857f4
      name: NTPポーリング間隔({$NTP_IP})
      type: DEPENDENT
      key: ntp.poll.remote
      delay: '0'
      history: 60d
      units: s
      description: NTPサーバとの同期間隔
      tags:
      - tag: Application
        value: NTP(リモート)
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: REGEX
        parameters:
        - (?m)^[*o]\s*\S+\s+\S+\s+\d+\s+\S+\s+\S+\s+(\d+)
        - \1
    - uuid: 1c5fa8d4c36e4a849660406bbb272083
      name: NTP推定遅延({$NTP_IP})
      type: DEPENDENT
      key: ntp.delay.remote
      delay: '0'
      history: 60d
      value_type: FLOAT
      units: ms
      description: NTPパケットの推定遅延時間
      tags:
      - tag: Application
        value: NTP(リモート)
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: REGEX
        parameters:
        - (?m)^[*o]\s*\S+\s+\S+\s+\d+\s+\S+\s+\S+\s+\d+\s+\d+\s+([-\d.]+)
        - \1
    - uuid: 36cf9d55f851405b8706f0bed8bf6566
      name: NTPオフセット({$NTP_IP})
      type: DEPENDENT
      key: ntp.offset.remote
      delay: '0'
      history: 60d
      value_type: FLOAT
      units: ms
      description: NTPサーバとの時刻ズレ
      tags:
      - tag: Application
        value: NTP(リモート)
      triggers:
      - uuid: 525b0f6f409e45d6ae06d4308ec44a74
        expression: last(/template_ntp_remote_accuracy/ntp.offset.remote)>5000 or last(/template_ntp_remote_accuracy/ntp.offset.remote)<-5000
        name: 上位NTPとのずれが5sを超えました({$NTP_IP})
        priority: AVERAGE
      - uuid: 5ba5a0128a6b4738bb0e592f9e8fdcd8
        expression: last(/template_ntp_remote_accuracy/ntp.offset.remote)>50 or last(/template_ntp_remote_accuracy/ntp.offset.remote)<-50
        name: 上位NTPとのずれが50msを超えました({$NTP_IP})
        priority: WARNING
        dependencies:
        - name: 上位NTPとのずれが5sを超えました({$NTP_IP})
          expression: last(/template_ntp_remote_accuracy/ntp.offset.remote)>5000 or last(/template_ntp_remote_accuracy/ntp.offset.remote)<-5000
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: REGEX
        parameters:
        - (?m)^[*o]\s*\S+\s+\S+\s+\d+\s+\S+\s+\S+\s+\d+\s+\d+\s+[-\d.]+\s+([-\d.]+)
        - \1
    - uuid: a152b245776e4017802215d2a4f711ff
      name: NTP分散({$NTP_IP})
      type: DEPENDENT
      key: ntp.jitter.remote
      delay: '0'
      history: 60d
      value_type: FLOAT
      units: ms
      description: NTPオフセットの過去8回の分散平均値
      tags:
      - tag: Application
        value: NTP(リモート)
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: REGEX
        parameters:
        - (?m)^[*o]\s*\S+\s+\S+\s+\d+\s+\S+\s+\S+\s+\d+\s+\d+\s+[-\d.]+\s+[-\d.]+\s+([-\d.]+)
        - \1
    macros:
    - macro: '{$NTP_IP}'
      value: 127.0.0.1
    dashboards:
    - uuid: e5f6a7b8c9d041f283b4c5d6e7f8a9b0
      name: NTP (リモート) 時刻精度ダッシュボード
      pages:
      - name: Overview
        widgets:
        - type: item
          name: NTPオフセット (ms)
          width: '12'
          height: '3'
          fields:
          - type: ITEM
            name: itemid.0
